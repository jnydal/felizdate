services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DJANGO_SETTINGS_MODULE: felizdate.settings
      PYTHONPATH: /app
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: felizdate
      PGUSER: felizdate
      PGPASSWORD: felizdate
      MEDIA_ROOT: /app/media
      MEDIA_URL: /media/
      REDIS_HOST: redis
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
    depends_on:
      - db
      - redis
    command: gunicorn felizdate.wsgi:application -c gunicorn_web.py

  realtime:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DJANGO_SETTINGS_MODULE: felizdate.settings
      PYTHONPATH: /app
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: felizdate
      PGUSER: felizdate
      PGPASSWORD: felizdate
      REDIS_HOST: redis
    ports:
      - "8080:8080"
    depends_on:
      - db
      - redis
    command: daphne -b 0.0.0.0 -p 8080 felizdate.asgi:application

  db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: felizdate
      POSTGRES_USER: felizdate
      POSTGRES_PASSWORD: felizdate
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  media_data:

